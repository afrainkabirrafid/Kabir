[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kabir"
version = "1.0.0"
description = "Kabir — a small, friendly programming language, built from scratch in Python."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Afrain Kabir Rafid" },
]
requires-python = ">=3.8"
keywords = ["programming-language", "interpreter", "kabir"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Interpreters",
]

[project.urls]
Homepage = "https://github.com/afrainkabirrafid/kabir"
Repository = "https://github.com/afrainkabirrafid/kabir"

[project.scripts]
kabir = "kabir.cli:main"

[tool.setuptools]
packages = ["kabir"]
